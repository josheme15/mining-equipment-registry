spring:
  application:
    name: mining-backend
  datasource:
    # Valores por defecto = MySQL local de docker-compose. En producción se sobrescriben con variables de entorno.
    url: ${DB_URL:jdbc:mysql://localhost:3306/mining}
    username: ${DB_USER:mining}
    password: ${DB_PASSWORD:mining}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Hibernate no toca el esquema: lo gestiona Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}       # Render inyecta PORT

# /health (en lugar de /actuator/health). Incluye la verificación de la base de datos.
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
      cors:   # Actuator tiene su propio CORS (el de CorsConfig aplica solo a la API)
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
